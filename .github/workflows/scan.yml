# workrr public scan: certify a public commit without the maintainer installing
# anything (docs/public-scans.md). Level "scanned". When a security check fails,
# it signs a finding instead (docs/findings.md).
#
# This workflow's identity is an OBSERVER certifier: Fulcio records
#   https://github.com/workrr-trust/certify/.github/workflows/scan.yml@<ref>
# and this repo as the source. Verifiers accept it only at a release tag pinned
# in the trust policy, so dispatch it at a tag:
#
#   gh workflow run scan.yml -R workrr-trust/certify --ref vX.Y.Z \
#     -f repository=owner/repo -f commit=<40-hex> -f path=skills/name
#
# or a batch of up to 50 (what watch.yml sends):
#
#   -f targets='[{"repository":"owner/repo","commit":"<40-hex>","path":"skills/name"}, ...]'
#
# Security model: the scanned project's code is never executed. It is checked out
# (public repos only, without credentials), hashed and pattern-scanned by this
# repo's certifier at the same commit as this workflow.
name: workrr-scan
run-name: ${{ inputs.targets != '' && 'scan batch' || format('scan {0}@{1} {2}', inputs.repository, inputs.commit, inputs.path) }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository (owner/repo)
        required: false
      commit:
        description: Full 40-hex commit SHA to scan
        required: false
      path:
        description: Artifact path in that repository (directory or file)
        required: false
      targets:
        description: Or a JSON array of up to 50 {repository, commit, path}
        required: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check inputs
        id: plan
        env:
          REPOSITORY: ${{ inputs.repository }}
          COMMIT: ${{ inputs.commit }}
          ARTIFACT_PATH: ${{ inputs.path }}
          TARGETS: ${{ inputs.targets }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ $REF == refs/tags/v* ]] || echo "::warning::not a release tag ($REF): verifiers will not accept these certificates or findings"
          if [ -n "$TARGETS" ]; then
            [ -z "$REPOSITORY$COMMIT$ARTIFACT_PATH" ] || { echo "::error::pass targets, or repository/commit/path, not both"; exit 1; }
            jq -e 'type == "array" and length >= 1 and length <= 50' <<<"$TARGETS" >/dev/null || { echo "::error::targets must be a JSON array of 1 to 50"; exit 1; }
            jq -c '.[] | [.repository, .commit, .path] | map(tostring)' <<<"$TARGETS" >all.jsonl
          else
            jq -nc --arg r "$REPOSITORY" --arg c "$COMMIT" --arg p "$ARTIFACT_PATH" '[$r, $c, $p]' >all.jsonl
          fi
          : >ok.jsonl
          while IFS=$'\t' read -r repo commit path; do
            bad() { echo "::warning::skipped $repo@$commit $path: $*"; }
            [[ $repo =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]] || { bad "repository must be owner/repo"; continue; }
            [[ $commit =~ ^[0-9a-f]{40}$ ]] || { bad "commit must be a full 40-hex SHA"; continue; }
            [[ $path =~ ^[A-Za-z0-9._@+-]+(/[A-Za-z0-9._@+-]+)*$ && ! /$path/ =~ /\.\.?/ ]] || [ "$path" = . ] || { bad "unsafe path"; continue; }
            # Public repositories only. This repo's token can't see anyone's private repo,
            # so a private one fails here too.
            [ "$(gh api "repos/$repo" --jq .private 2>/dev/null)" = false ] || { bad "not a public repository"; continue; }
            jq -nc --arg r "$repo" --arg c "$commit" --arg p "$path" '{repository: $r, commit: $c, path: $p}' >>ok.jsonl
          done < <(jq -r '@tsv' all.jsonl)
          [ -s ok.jsonl ] || { echo "::error::no valid targets"; exit 1; }
          echo "targets=$(jq -sc . ok.jsonl)" >>"$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
      max-parallel: 10
      fail-fast: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # A fetch that fails is retried (GitHub drops a connection now and then). Two things
      # no retry fixes end the job as "not scanned" instead of failing it, and nothing is
      # signed: the repository's Git LFS objects can't be downloaded (over its LFS budget),
      # or the path isn't in that commit (it was moved or deleted).
      - name: Check out the scanned commit (no credentials)
        id: checkout
        env:
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
          ARTIFACT_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          git init --quiet subject
          for attempt in 1 2 3; do
            git -C subject -c credential.helper= fetch --quiet --depth 1 "https://github.com/$REPOSITORY" "$COMMIT" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 20))
          done
          if ! git -C subject -c advice.detachedHead=false checkout --quiet FETCH_HEAD 2>checkout.err; then
            cat checkout.err >&2
            grep -q "smudge filter lfs failed" checkout.err || exit 1
            echo "skip=its Git LFS objects could not be downloaded" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$(git -C subject rev-parse HEAD)" = "$COMMIT" ]
          [ -e "subject/$ARTIFACT_PATH" ] || echo "skip=$ARTIFACT_PATH is not in this commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.checkout.outputs.skip == ''
        with:
          path: .workrr-certifier
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.checkout.outputs.skip == ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .workrr-certifier/package-lock.json
      - name: Build certifier
        if: steps.checkout.outputs.skip == ''
        working-directory: .workrr-certifier
        run: npm ci --ignore-scripts && npm run build
      - name: Certify (observe)
        id: run
        if: steps.checkout.outputs.skip == ''
        env:
          REPOSITORY: ${{ matrix.repository }}
          ARTIFACT_PATH: ${{ matrix.path }}
        run: |
          status=0
          node .workrr-certifier/dist/cli.js certify "subject/$ARTIFACT_PATH" \
            --observe "https://github.com/$REPOSITORY" \
            --predicate-out predicate.json --statement-out statement.json \
            --finding-out finding.json || status=$?
          # 1 means a check failed: a finding is signed below when a security check
          # failed; layout problems alone sign nothing. 2 is an error.
          [ "$status" -le 1 ]
      # Rekor answers "error creating tlog entry" or times out now and then: each signing
      # step is tried once more a minute later. A retry after a failure that reached
      # Rekor only adds a second log entry for the same statement.
      - name: Sign the certificate and log to Rekor
        id: attest1
        if: steps.run.outputs.certified == 'true'
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.run.outputs.subject-name }}
          subject-digest: ${{ steps.run.outputs.subject-digest }}
          predicate-type: https://trust.workrr.ai/certificate/v0.1
          predicate-path: predicate.json
      - name: Sign the finding and log to Rekor
        id: finding1
        if: steps.run.outputs.finding != ''
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.run.outputs.subject-name }}
          subject-digest: ${{ steps.run.outputs.subject-digest }}
          predicate-type: https://trust.workrr.ai/finding/v0.1
          predicate-path: finding.json
      - name: Wait before signing again
        if: steps.attest1.outcome == 'failure' || steps.finding1.outcome == 'failure'
        run: sleep 60
      - name: Sign the certificate and log to Rekor (second try)
        id: attest2
        if: steps.attest1.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.run.outputs.subject-name }}
          subject-digest: ${{ steps.run.outputs.subject-digest }}
          predicate-type: https://trust.workrr.ai/certificate/v0.1
          predicate-path: predicate.json
      - name: Sign the finding and log to Rekor (second try)
        id: finding2
        if: steps.finding1.outcome == 'failure'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.run.outputs.subject-name }}
          subject-digest: ${{ steps.run.outputs.subject-digest }}
          predicate-type: https://trust.workrr.ai/finding/v0.1
          predicate-path: finding.json
      - name: Collect
        env:
          CERT: ${{ steps.attest1.outputs.bundle-path || steps.attest2.outputs.bundle-path }}
          FINDING_BUNDLE: ${{ steps.finding1.outputs.bundle-path || steps.finding2.outputs.bundle-path }}
          SKIP: ${{ steps.checkout.outputs.skip }}
          KIND: ${{ steps.run.outputs.finding }}
          LEVEL: ${{ steps.run.outputs.level }}
          BAND: ${{ steps.run.outputs.band }}
          SUBJECT: ${{ steps.run.outputs.subject-name }}
          DIGEST: ${{ steps.run.outputs.subject-digest }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
          ARTIFACT_PATH: ${{ matrix.path }}
        run: |
          mkdir -p out
          echo "### workrr public scan: \`$REPOSITORY@${COMMIT:0:12}\` \`$ARTIFACT_PATH\`" >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$SKIP" ]; then
            echo "- not scanned, nothing signed: $SKIP" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- subject: \`$SUBJECT\` \`$DIGEST\`" >>"$GITHUB_STEP_SUMMARY"
          if [ -n "$CERT" ]; then
            cp "$CERT" out/certificate.sigstore.json
            cp statement.json out/statement.json
            echo "- **Scanned** (band $BAND); not signed by the maintainer" >>"$GITHUB_STEP_SUMMARY"
          elif [ -n "$FINDING_BUNDLE" ]; then
            cp "$FINDING_BUNDLE" out/finding.sigstore.json
            jq --slurpfile p finding.json '.predicateType = "https://trust.workrr.ai/finding/v0.1" | .predicate = $p[0]' statement.json >out/statement.json
            echo "- **Flagged** ($KIND): $(jq -r '[.findings[] | .detail + " " + (.file // "") + (if .line then ":\(.line)" else "" end)] | join("; ")' finding.json)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "- not certified, nothing signed (no security check failed)" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workrr-scan-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  # One index per run, so the ledger's discover makes one download per batch
  # instead of one per target. It is only a hint: the ledger re-fetches every bundle
  # from the attestation store and verifies it from scratch.
  index:
    needs: scan
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: workrr-scan-*
          path: scans
      - name: Index
        run: |
          : >index.jsonl
          # download-artifact extracts a lone matching artifact straight into scans/
          # rather than scans/<name>/, so a one-target batch lands in scans/ itself.
          for d in scans/ scans/*/; do
            [ -f "$d/statement.json" ] || continue
            b=$(ls "$d"/*.sigstore.json 2>/dev/null | head -1)
            jq -c --arg idx "$(jq -r '.verificationMaterial.tlogEntries[0].logIndex // empty' "$b" 2>/dev/null)" \
              '{digest: .subject[0].digest.sha256, predicateType, logIndex: $idx, source: .predicate.source}' \
              "$d/statement.json" >>index.jsonl
          done
          echo "$(wc -l <index.jsonl) record(s)" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workrr-scan-index
          path: index.jsonl
