# Sign one revocation entry and the checkpoint that covers it.
# Does not deploy, publish, or upload to R2. Do not run it until there is
# something to revoke. Shawn reviews the artifact and follows docs/revocation.md.
#
# Run from a release tag. The verifier accepts only
#   https://github.com/workrr-trust/certify/.github/workflows/revoke.yml@refs/tags/vX.Y.Z
name: revoke

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: "Monotonic revocation sequence (1 for the first entry)"
        required: true
        type: string
      prev:
        description: "sha256 of the previous entry, or 64 zeros for the first"
        required: true
        type: string
      reason:
        description: "Why this artifact or certificate is revoked (one line)"
        required: true
        type: string
      artifact_digest:
        description: "64 lowercase hex sha256 of the artifact. Leave empty to revoke by log index."
        required: false
        type: string
        default: ""
      log_index:
        description: "Rekor log index of the certificate. Leave empty to revoke by artifact digest."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::sign revocations from a release tag, not $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Render the entry and checkpoint
        env:
          SEQUENCE: ${{ inputs.sequence }}
          PREV: ${{ inputs.prev }}
          REASON: ${{ inputs.reason }}
          DIGEST: ${{ inputs.artifact_digest }}
          LOG_INDEX: ${{ inputs.log_index }}
        run: |
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/revoke.yml@${GITHUB_REF}"
          node scripts/render-revocation.mjs \
            --sequence "$SEQUENCE" \
            --prev "$PREV" \
            --reason "$REASON" \
            --timestamp "$stamp" \
            --signer "$signer" \
            --artifact-digest "$DIGEST" \
            --log-index "$LOG_INDEX" \
            --out-dir revocation

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the entry and the checkpoint (keyless)
        run: |
          cosign sign-blob --yes --bundle revocation/entry.sigstore.json revocation/entry.json
          cosign sign-blob --yes --bundle revocation/checkpoint.sigstore.json revocation/checkpoint.json
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/revoke.yml@${GITHUB_REF}"
          for f in entry checkpoint; do
            cosign verify-blob \
              --bundle "revocation/$f.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "revocation/$f.json"
          done
          node scripts/pack-signed-blob.mjs application/vnd.workrr.revocation-entry+json \
            revocation/entry.json revocation/entry.sigstore.json revocation/entry.signed.json
          node scripts/pack-signed-blob.mjs application/vnd.workrr.revocation-checkpoint+json \
            revocation/checkpoint.json revocation/checkpoint.sigstore.json revocation/checkpoint.signed.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-revocation
          path: revocation/
          if-no-files-found: error
