# workrr trust certifier on GitLab CI: the witness for Reproduced (wire level gold).
#
# Runs only in gitlab.com/workrr-trust/certify-gitlab, GitLab's copy of
# github.com/workrr-trust/certify, on a release tag, for a pipeline started with:
#   WORKRR_REPO    https://github.com/<owner>/<repo> (public)
#   WORKRR_COMMIT  full commit SHA
#   WORKRR_PATH    artifact path in that repository
# Fulcio records:
#   SAN                  https://gitlab.com/workrr-trust/certify-gitlab//.gitlab-ci.yml@refs/tags/<tag>
#   Build Signer Digest  the tagged commit (ci_config_sha)
#   Source repository    https://gitlab.com/workrr-trust/certify-gitlab
# The trust policy accepts that identity only as a witness: alone it verifies as
# Scanned, and next to the publisher's own Tested certificate from certify.yml for
# the same commit, path and checks it makes Reproduced (docs/gitlab-certifier.md).
#
# Security model (as in .github/workflows/certify.yml): the certifier is this
# checkout at the tag, so no variable can change the code that signs. Artifact code
# (its test suite) runs only in workrr-test, which has no id_tokens. workrr-certify
# never runs artifact code; it re-derives the digest and only accepts a test report
# for that digest.

workflow:
  rules:
    - if: '$CI_PROJECT_PATH == "workrr-trust/certify-gitlab" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $WORKRR_REPO =~ /^https:\/\/github\.com\/[A-Za-z0-9][A-Za-z0-9-]*\/[A-Za-z0-9._-]+$/ && $WORKRR_COMMIT =~ /^[0-9a-f]{40}$/ && $WORKRR_PATH'

stages:
  - test
  - certify

default:
  image: node:24-bookworm@sha256:e2007d1f4e652444f88d9bb196256d2d035269015e3d27a0d47c1d0cb5192a98

.subject: &subject
  - |
    set -euo pipefail
    # "." is a whole-repo artifact; any other "." or ".." segment is refused.
    if [[ ! ( $WORKRR_PATH == . || ( $WORKRR_PATH =~ ^[A-Za-z0-9._@+-]+(/[A-Za-z0-9._@+-]+)*$ && ! /$WORKRR_PATH/ =~ /\.\.?/ ) ) ]]; then
      echo "unsafe WORKRR_PATH: $WORKRR_PATH" >&2
      exit 1
    fi
    npm ci --ignore-scripts && npm run build
    git init --quiet subject
    git -C subject fetch --quiet --depth 1 "$WORKRR_REPO" "$WORKRR_COMMIT"
    git -C subject -c advice.detachedHead=false checkout --quiet FETCH_HEAD

workrr-test:
  stage: test
  # No id_tokens: the artifact's tests run here and cannot sign.
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv >/dev/null
    - *subject
    - |
      python3 -m venv /tmp/workrr-py
      export PATH="/tmp/workrr-py/bin:$PATH" VIRTUAL_ENV=/tmp/workrr-py
      # A failing suite still produces a report; certify decides.
      node dist/cli.js test "subject/$WORKRR_PATH" --out tests.json || true
  artifacts:
    paths:
      - tests.json
    expire_in: 1 day

workrr-certify:
  stage: certify
  needs:
    - job: workrr-test
      artifacts: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - *subject
    - |
      node dist/cli.js certify "subject/$WORKRR_PATH" --witness "$WORKRR_REPO" --tests-report tests.json \
        --predicate-out predicate.json --statement-out statement.json
      mkdir -p certificate
      node scripts/gitlab-sign.mjs --statement statement.json --out certificate/certificate.sigstore.json
      cp statement.json certificate/statement.json
  artifacts:
    paths:
      - certificate/
